{% extends "base.html" %}

{% block content %}

<div class="card">

    <h1 class="title">QR Code Generator</h1>

    <p class="subtitle">
        Generate QR Codes for
        Links, Images, Videos & PDF
    </p>

    <form action="/generate"
          method="POST"
          enctype="multipart/form-data">

        <input
            type="text"
            name="text"
            placeholder="Paste URL or Enter Text">

        <div class="upload-box">

            <label>

                📁 Choose File

                <input
                    type="file"
                    name="file"
                    hidden>

            </label>

        </div>

        <button class="generate-btn">

            Generate QR

        </button>

    </form>

    {% if qr_image %}

    <div class="qr-box">

        <h2>Your QR Code</h2>

        <img src="{{ url_for('static',
        filename='qr_codes/' + qr_image) }}">

        <p class="data-text">

            {{ data }}

        </p>

        <a
        href="{{ url_for('static',
        filename='qr_codes/' + qr_image) }}"
        download>

            <button class="download-btn">

                Download QR

            </button>

        </a>

    </div>

    {% endif %}

</div>

<footer>

<img src="{{ url_for('static',
filename='logo_icon.png') }}">

<h3>Surewal.Tech</h3>

<p>

© 2026 All Rights Reserved

</p>

</footer>

{% endblock %}
